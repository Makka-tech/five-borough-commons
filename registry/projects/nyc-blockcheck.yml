id: nyc-blockcheck
name: NYC BlockCheck
slug: nyc-blockcheck
tagline: A proposed neighborhood tool for checking block-level public information.
summary: NYC BlockCheck is a potential flagship project. Its purpose and repository connection must be confirmed with affected residents and prospective stewards before incubation.
status: proposed
demo: false
boroughs:
  - Citywide
problemStatement: People may need a more understandable way to find and verify public, block-level information relevant to everyday decisions.
residentValue: A carefully scoped tool could make verified public information easier to understand and report when it is incomplete.
currentScope: Research the resident need, existing tools, public data quality, safety considerations, and sustainable stewardship before proposing software.
nonGoals:
  - This project does not claim that a repository or community partnership is connected.
  - This project does not publish personal information or exact residential addresses.
  - This project is not an official City service.
